name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 只是加个缓存，失败也不影响构建（GitHub CDN 偶尔 504 拿不到 gradle 发行包）
      - name: Set up Gradle (cache)
        id: setup-gradle
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug + release
        run: |
          set -e
          run_build() {
            echo "== using $1 =="
            shift
            "$@" --no-daemon --stacktrace assembleDebug assembleRelease
          }

          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            run_build gradlew ./gradlew
          elif command -v gradle >/dev/null 2>&1; then
            gradle --version | head -4
            run_build gradle gradle
          else
            # 最后一招：自己下发行包，带重试
            echo "gradle not on PATH, downloading 8.7"
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 5 --retry-delay 5 -o /tmp/gradle.zip \
                   https://services.gradle.org/distributions/gradle-8.7-bin.zip; then
                ok=1; break
              fi
              echo "download failed (attempt $i), retrying"; sleep 15
            done
            [ "$ok" = "1" ] || { echo "cannot obtain gradle" >&2; exit 1; }
            unzip -q /tmp/gradle.zip -d /tmp
            run_build "downloaded gradle" /tmp/gradle-8.7/bin/gradle
          fi

      - name: Collect APKs
        run: |
          set -e
          VER=$(grep -oE 'versionName "[^"]+"' app/build.gradle | head -1 | cut -d'"' -f2)
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' | while read -r f; do
            case "$f" in
              *release*) cp "$f" "dist/MirrorTap-v${VER}.apk" ;;
              *debug*)   cp "$f" "dist/MirrorTap-debug-v${VER}.apk" ;;
            esac
          done
          ls -lh dist
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorTap-apk
          path: dist/*
          retention-days: 30

      - name: Attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
